<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden;background:#0d1117;font-family:Inter,sans-serif;color:#e6edf3}

.map{position:absolute;left:692px;top:414px;width:520px;font-size:17px;color:#8b949e;display:flex;gap:10px;align-items:center}
